<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart - The Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="topnav">
    <a href="index.html" class="brand"><span class="hole"></span> The Store</a>
    <div class="nav-links">
      <a href="categories.html">Shop</a>
      <a href="cart.html" class="cart-link">Cart <span class="count">0</span></a>
    </div>
  </nav>

  <div class="page-head">
    <div>
      <h2 class="headline">Shopping Cart</h2>
      <p class="sub">Review your order and choose how you'll receive it.</p>
    </div>
  </div>

  <div id="cartRoot"></div>

  <footer>The Store — Training / portfolio project</footer>

  <script src="script.js"></script>
  <script>
    const root = document.getElementById("cartRoot");
    let fulfillment = "delivery";

    function renderCart() {
      const cart = getCart();

      if (cart.length === 0) {
        root.innerHTML = `
          <div class="empty-cart">
            <div class="headline" style="font-size:1.4rem; margin-bottom:0.6rem;">Your cart is empty</div>
            <p>You haven't added anything yet. <a href="categories.html" style="color:var(--tag)">Start shopping</a></p>
          </div>`;
        return;
      }

      root.innerHTML = `
        <div class="cart-wrap">
          <div class="cart-items" id="cartItems">
            ${cart.map((item) => `
              <div class="cart-row" data-line="${item.lineId}">
                <div class="thumb">
    <img src="${item.image}" alt="${item.name}">
                    </div>
                <div class="meta">
                  <h4>${item.name}</h4>
                  <div class="line">Size ${item.size} · Qty ${item.qty}</div>
                </div>
                <div class="actions">
                  <div class="price">${item.price * item.qty} EGP</div>
                  <button class="remove-btn" data-remove="${item.lineId}" title="Remove">✕</button>
                </div>
              </div>`).join("")}
          </div>

          <div class="summary-box">
            <h3>Order summary</h3>
            <div class="summary-row"><span>Items</span><span>${cartCount()}</span></div>
            <div class="summary-row total"><span>Total</span><span>${cartTotal()} EGP</span></div>

            <div class="fulfillment-choice">
              <button class="fulfillment-btn active" data-mode="delivery">Home delivery</button>
              <button class="fulfillment-btn" data-mode="pickup">Pickup from store</button>
            </div>

            <form id="checkoutForm">
              <div class="field">
                <label>Name</label>
                <input type="text" id="custName" required>
              </div>
              <div class="field">
                <label>Phone number</label>
                <input type="tel" id="custPhone" required>
              </div>
              <div class="field" id="addressField">
                <label>Full address</label>
                <textarea id="custAddress" rows="2"></textarea>
              </div>

              <button type="submit" class="btn-primary">Confirm order</button>
              <div class="form-note" id="checkoutNote"></div>
            </form>

            <div id="orderConfirm"></div>
          </div>
        </div>`;

      document.getElementById("cartItems").addEventListener("click", (e) => {
        const btn = e.target.closest("[data-remove]");
        if (!btn) return;
        removeFromCart(btn.dataset.remove);
        renderCartBadge();
        renderCart();
      });

      const fulfillmentBtns = document.querySelectorAll(".fulfillment-btn");
      const addressField = document.getElementById("addressField");
      fulfillmentBtns.forEach((btn) => {
        btn.addEventListener("click", () => {
          fulfillmentBtns.forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          fulfillment = btn.dataset.mode;
          addressField.classList.toggle("hidden", fulfillment === "pickup");
        });
      });

      document.getElementById("checkoutForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const name = document.getElementById("custName").value.trim();
        const phone = document.getElementById("custPhone").value.trim();
        const address = document.getElementById("custAddress").value.trim();
        const note = document.getElementById("checkoutNote");

        if (!name || !phone) {
          note.textContent = "Please fill in your name and phone number";
          note.classList.remove("success");
          return;
        }
        if (fulfillment === "delivery" && !address) {
          note.textContent = "We need your address to deliver the order";
          note.classList.remove("success");
          return;
        }

        const orderId = generateOrderId();
        const order = {
          orderId,
          name,
          phone,
          address: fulfillment === "delivery" ? address : null,
          fulfillment,
          items: getCart(),
          total: cartTotal(),
          createdAt: new Date().toISOString(),
        };
        localStorage.setItem("lastOrder", JSON.stringify(order));

        note.textContent = "";
        document.getElementById("checkoutForm").style.display = "none";

        const confirmBox = document.getElementById("orderConfirm");
        confirmBox.innerHTML = `
         <div class="product-thumb">
    <img src="${p.image}" alt="${p.name}">
</div>
          <div class="order-confirm">
            <div>${fulfillment === "pickup" ? "Your pickup code" : "Your order code"}</div>
            <div class="code">${orderId}</div>
            <p>${fulfillment === "pickup"
              ? "Keep this code and show it to the store when you pick up your order."
              : "The store will contact you on your number to confirm delivery."}</p>
          </div>`;

        saveCart([]);
        renderCartBadge();
      });
    }

    renderCart();
  </script>
</body>
</html>
