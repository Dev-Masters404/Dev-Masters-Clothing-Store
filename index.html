<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="topnav">
    <a href="index.html" class="brand"><span class="hole"></span> <span data-i18n="brand">The Store</span></a>
    <div class="nav-links">
      <a href="categories.html" data-i18n="navShop">Shop</a>
      <a href="cart.html" class="cart-link"><span data-i18n="navCart">Cart</span> <span class="count">0</span></a>
      <button id="langToggle" class="icon-btn">EN</button>
      <button id="themeToggle" class="icon-btn">☀</button>
    </div>
  </nav>

  <section class="hero">
    <div class="tag-mark"><span class="hole"></span> <span data-i18n="heroTag">A tailored shopping experience</span></div>
    <h1 class="headline" data-i18n="heroTitle">We dress you for you, not just anyone</h1>
    <p data-i18n="heroSub">Before you start browsing, tell us who you're shopping for.</p>

    <div class="age-picker" id="agePicker">
      <button class="age-chip" data-age="kids"><span data-i18n="ageKids">Kids</span><small data-i18n="ageKidsSub">Up to 12</small></button>
      <button class="age-chip" data-age="teens"><span data-i18n="ageTeens">Teens</span><small data-i18n="ageTeensSub">13 - 19</small></button>
      <button class="age-chip" data-age="youth"><span data-i18n="ageYouth">Young Adults</span><small data-i18n="ageYouthSub">20 - 35</small></button>
      <button class="age-chip" data-age="adults"><span data-i18n="ageAdults">Adults</span><small data-i18n="ageAdultsSub">36+</small></button>
    </div>
  </section>

  <footer data-i18n="footer">The Store — Training / portfolio project</footer>

  <script src="script.js"></script>
  <script>
    const agePicker = document.getElementById("agePicker");

    const currentAge = getAgeGroup();
    if (currentAge) {
      const activeBtn = agePicker.querySelector(`[data-age="${currentAge}"]`);
      if (activeBtn) activeBtn.classList.add("active");
    }

    agePicker.addEventListener("click", (e) => {
      const btn = e.target.closest(".age-chip");
      if (!btn) return;
      setAgeGroup(btn.dataset.age);
      window.location.href = "categories.html";
    });
  </script>
</body>
</html>
