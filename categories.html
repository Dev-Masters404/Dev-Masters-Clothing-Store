<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop - The Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="topnav">
    <a href="index.html" class="brand"><span class="hole"></span> The Store</a>
    <div class="nav-links">
      <a href="categories.html">Shop</a>
      <a href="cart.html" class="cart-link">Cart <span class="count">0</span></a>
    </div>
  </nav>

  <!-- <div class="product-thumb">
    <img src="${p.image}" alt="${p.name}">
</div> -->

  <div class="page-head">
    <div>
      <h2 class="headline">Choose your category</h2>
      <p class="sub" id="ageNote">Products shown here are filtered based on the age group you picked.</p>
    </div>
  </div>

  <div class="filter-bar" id="filterBar">
    <button class="filter-chip active" data-cat="all">All</button>
  </div>

  <div class="product-grid" id="productGrid"></div>

  <footer>The Store — Training / portfolio project</footer>

  <script src="script.js"></script>
  <script>
    const filterBar = document.getElementById("filterBar");
    const productGrid = document.getElementById("productGrid");
    const ageNote = document.getElementById("ageNote");

    let activeCategory = "all";
    const ageGroup = getAgeGroup();

    if (ageGroup) {
      ageNote.textContent = `You're seeing items suited for "${AGE_LABELS[ageGroup]}". `;
      const changeLink = document.createElement("a");
      changeLink.href = "index.html";
      changeLink.style.color = "var(--tag)";
      changeLink.textContent = "Change group";
      ageNote.appendChild(changeLink);
    }

    CATEGORIES.forEach((cat) => {
      const chip = document.createElement("button");
      chip.className = "filter-chip";
      chip.dataset.cat = cat.id;
      chip.textContent = cat.label;
      filterBar.appendChild(chip);
    });

    function getVisibleProducts() {
      return PRODUCTS.filter((p) => {
        const matchesAge = !ageGroup || p.ageGroups.includes(ageGroup);
        const matchesCat = activeCategory === "all" || p.category === activeCategory;
        return matchesAge && matchesCat;
      });
    }

    function renderGrid() {
      const items = getVisibleProducts();
      productGrid.innerHTML = "";

      if (items.length === 0) {
        productGrid.style.display = "block";
        productGrid.innerHTML = `
          <div class="empty-state">
            <div class="headline">No products here yet</div>
            <p>Try another category or change your age group.</p>
          </div>`;
        return;
      }

      productGrid.style.display = "grid";
      items.forEach((p) => {
        const catLabel = CATEGORIES.find((c) => c.id === p.category)?.label || p.category;
        const card = document.createElement("a");
        card.href = `product.html?id=${p.id}`;
        card.className = "product-card";
        card.innerHTML = `
          <div class="product-thumb"> 
    <img src="${p.image}" alt="${p.name}">
            </div>
          
          <div class="product-info">
            <div class="cat-label">${catLabel}</div>
            <h3>${p.name}</h3>
            <div class="price">${p.price} EGP</div>
          </div>`;
        productGrid.appendChild(card);
      });
    }

    filterBar.addEventListener("click", (e) => {
      const chip = e.target.closest(".filter-chip");
      if (!chip) return;
      filterBar.querySelectorAll(".filter-chip").forEach((c) => c.classList.remove("active"));
      chip.classList.add("active");
      activeCategory = chip.dataset.cat;
      renderGrid();
    });

    renderGrid();
  </script>
</body>
</html>
